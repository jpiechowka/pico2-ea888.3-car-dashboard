[workspace]
resolver = "2"
members = ["crates/dashboard-core", "crates/dashboard-config", "crates/dashboard-config-tools", "crates/dashboard-build-profiles", "crates/dashboard-helper-protocol"]
exclude = ["firmware", "host", "configurator", "studio-helper"]

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
# Preserve WebAssembly binding metadata until wasm-bindgen has processed it.
strip = false
