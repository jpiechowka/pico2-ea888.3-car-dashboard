name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  python-quality:
    name: Python quality (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.15']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python-quality-requirements.txt
      - name: Install hash-locked quality tools
        run: python -m pip install --require-hashes -r python-quality-requirements.txt
      - name: Lint maintained Python
        run: python -m ruff check .
      - name: Check Python formatting
        run: python -m ruff format --check .
      - name: Strict production-boundary types
        run: python -m mypy
      - name: ELF and UF2 admission regressions
        run: python firmware/scripts/test_program_image.py
      - name: BLE utility admission regressions
        run: |
          python firmware/scripts/test_ble_probe_image.py
          python -O firmware/scripts/test_ble_probe_image.py
          python firmware/scripts/test_probe_security_guard.py
          python -O firmware/scripts/test_probe_security_guard.py
      - name: Browser process ownership regressions
        run: python -m unittest discover -s configurator/scripts -p test_browser_process.py
      - name: Shared process ownership and stream bounds
        run: python -m unittest discover -s host/scripts -p test_owned_process.py

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-18
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
        working-directory: firmware
      - name: Check host formatting
        run: cargo fmt --all --check
        working-directory: host
      - name: Check shared formatting
        run: cargo fmt --all --check

  portable:
    name: Shared core native and no_std targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-18
          components: clippy
          targets: thumbv8m.main-none-eabihf,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Shared unit contracts and both outlines
        run: |
          cargo test --locked -p dashboard-core
          cargo test --locked -p dashboard-core --no-default-features
          cargo clippy --locked -p dashboard-core --all-targets -- -D warnings
      - name: Portable no_std builds
        run: |
          cargo check --locked -p dashboard-core --target thumbv8m.main-none-eabihf
          cargo check --locked -p dashboard-core --target wasm32-unknown-unknown
      - name: Bounded configuration contracts
        run: |
          cargo test --locked -p dashboard-config
          cargo test --locked -p dashboard-config --features json
          cargo clippy --locked -p dashboard-config --all-targets --features json -- -D warnings
          cargo check --locked -p dashboard-config --target thumbv8m.main-none-eabihf
          cargo check --locked -p dashboard-config --features json --target wasm32-unknown-unknown
      - name: Shared clock profile contracts
        run: |
          cargo test --locked -p dashboard-build-profiles
          cargo test --locked -p dashboard-build-profiles --features serde
          cargo clippy --locked -p dashboard-build-profiles --all-targets --all-features -- -D warnings
          cargo check --locked -p dashboard-build-profiles --target thumbv8m.main-none-eabihf
          cargo check --locked -p dashboard-build-profiles --features serde --target wasm32-unknown-unknown
      - name: Configuration build and file contracts
        run: |
          cargo test --locked -p dashboard-config-tools
          cargo clippy --locked -p dashboard-config-tools --all-targets -- -D warnings
          cargo run --locked -p dashboard-config-tools -- compile configs/default.json /tmp/default.eav
          cmp configs/default.eav /tmp/default.eav

      - name: Typed provenance contracts
        run: |
          cargo test --locked -p dashboard-provenance
          cargo clippy --locked -p dashboard-provenance --all-targets -- -D warnings

      - name: Bounded startup artwork conversion contracts
        run: |
          cargo test --locked -p dashboard-startup-tools
          cargo clippy --locked -p dashboard-startup-tools --all-targets -- -D warnings

      - name: Shared helper protocol contracts
        run: |
          cargo test --locked -p dashboard-helper-protocol
          cargo clippy --locked -p dashboard-helper-protocol --all-targets -- -D warnings
          cargo check --locked -p dashboard-helper-protocol --target wasm32-unknown-unknown
          cargo clippy --locked -p dashboard-helper-protocol --target wasm32-unknown-unknown -- -D warnings

  studio-helper:
    name: Helper pure contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: studio-helper
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-18
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: studio-helper
      - run: cargo fmt --all --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

      - name: Windows dashboard wrapper contracts
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: |
          cargo fetch --locked
          ./firmware/scripts/Test-BuildDashboard.ps1
          ./configurator/Test-SetupTools.ps1
      - name: Windows capture paths and native artifact contracts
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: |
          python firmware/scripts/test_target_capture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s studio-helper/tests -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s configurator/scripts -p 'test_browser_process.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  configurator:
    name: Configurator state and WebAssembly
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: configurator
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-18
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: configurator
      - run: cargo fmt --all --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo check --locked --target wasm32-unknown-unknown
      - run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - name: Build production browser assets
        env:
          NO_COLOR: 'true'
        run: |
          cargo install trunk --version 0.21.14 --locked
          trunk build --release --locked
      - name: Strict browser harness Clippy
        run: cargo clippy --locked --target wasm32-unknown-unknown --features browser-tests -- -D warnings
      - name: Browser process cleanup contracts
        run: python3 -m unittest discover -s scripts -p 'test_browser_process.py'
      - name: Browser storage, worker, transport and rendering failures
        timeout-minutes: 15
        env:
          NO_COLOR: 'true'
        run: |
          trunk build --release --locked --features browser-tests --dist target/browser-tests
          browser="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$browser" ]; then
            echo "::error::Chrome or Chromium is required for the browser failure suite"
            exit 1
          fi
          "$browser" --version
          python3 scripts/browser_failure_tests.py --browser "$browser" --dist target/browser-tests --timeout 90

  host:
    name: Host contracts and benchmark smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-18
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: host
      - name: Host contracts
        run: cargo test --locked
        working-directory: host
      - name: Verify vendored HAL source
        run: |
          cargo build --locked --release -p dashboard-provenance
          target/release/dashboard-provenance hal --vendor-root firmware/vendor
      - name: Verify radio source and firmware provenance
        run: |
          target/release/dashboard-provenance radio --vendor-root firmware/vendor
          python3 firmware/scripts/test_radio_vendor.py
          python3 -O firmware/scripts/test_radio_vendor.py
      - name: Radio transport and security regressions
        run: |
          cargo test --locked --manifest-path firmware/vendor/cyw43/Cargo.toml --target x86_64-unknown-linux-gnu --lib --features bluetooth-only,firmware-logs
          cargo test --locked --manifest-path firmware/vendor/cyw43/Cargo.toml --target x86_64-unknown-linux-gnu --lib --features bluetooth
          cargo test --locked --manifest-path firmware/vendor/trouble-host/Cargo.toml --target x86_64-unknown-linux-gnu --lib --no-default-features --features central,gatt,security,default-packet-pool -- --test-threads=1
      - name: Discovery-only GATT regressions and forbidden security unification
        run: |
          cargo test --locked --manifest-path firmware/vendor/trouble-host/Cargo.toml --target x86_64-unknown-linux-gnu --lib --no-default-features --features central,gatt,scan,discovery-no-security,default-packet-pool -- --test-threads=1
          cargo test --locked --manifest-path firmware/vendor/trouble-host/Cargo.toml --target x86_64-unknown-linux-gnu --lib --no-default-features --features central,gatt,scan,discovery-no-security,default-packet-pool-size-8,default-packet-pool-mtu-251,gatt-client-notification-queue-size-4 -- --test-threads=1
          python3 firmware/scripts/check_probe_security_guard.py --target x86_64-unknown-linux-gnu
      - name: Target artifact capture contracts
        run: |
          cargo fetch --locked --manifest-path ../Cargo.toml
          python3 scripts/test_target_capture.py
          python3 scripts/test_practical_image.py
          python3 -O scripts/test_practical_image.py
          python3 scripts/test_clock_profiles.py
          python3 scripts/test_stack_budget.py
          python3 -O scripts/test_stack_budget.py
          python3 -O scripts/test_validation_policy.py
        working-directory: firmware
      - name: Experimental snapshot regressions
        run: |
          python3 -B -m unittest test_config_sources.SourcePhaseSnapshot test_phase_comparison
          python3 -B -O -m unittest test_config_sources.SourcePhaseSnapshot test_phase_comparison
        working-directory: firmware/scripts
      - name: Full outline contracts
        run: cargo test --locked --no-default-features
        working-directory: host
      - name: Host Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: host
      - name: Benchmark smoke
        run: cargo test --locked --benches
        working-directory: host
      - name: Benchmark comparison contracts
        run: python3 scripts/test_benchmark_comparison.py
        working-directory: host
      - name: Telemetry collector and producer contracts
        run: python3 scripts/test_telemetry_export.py
        working-directory: host

  clippy-pico2:
    name: Clippy (Pico 2 W)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-18
          components: clippy
          targets: thumbv8m.main-none-eabihf
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: firmware
      - name: Fetch locked firmware dependencies
        # Offline policy checks inspect optional backends, including BLE crypto.
        run: cargo fetch --locked
        working-directory: firmware
      - name: Clippy (pico2)
        run: cargo clippy --locked -p dashboard-pico2 --target thumbv8m.main-none-eabihf -- -D warnings
        working-directory: firmware
      - name: UART ownership compile guards
        run: python3 scripts/check_uart_api.py
        working-directory: firmware
      - name: Logging feature and flush policy
        run: |
          python3 scripts/test_logging_policy.py
          python3 -O scripts/test_logging_policy.py
          python3 scripts/check_logging_policy.py
        working-directory: firmware
      - name: Vehicle transport Clippy
        run: cargo clippy --locked -p dashboard-pico2 --features ble-obd -- -D warnings
        working-directory: firmware
      - name: Legacy Longan transport Clippy
        run: cargo clippy --locked -p dashboard-pico2 --features longan-rx12 -- -D warnings
        working-directory: firmware
      - name: Demo Clippy
        run: cargo clippy --locked -p dashboard-pico2 --features demo,frame-trace,te-trace -- -D warnings
        working-directory: firmware
      - name: Target benchmark Clippy
        run: cargo clippy --locked -p dashboard-pico2 --features target-bench,ble-obd,frame-trace,te-trace -- -D warnings
        working-directory: firmware
      - name: Mutually exclusive profile guards
        run: |
          cargo fetch --locked --manifest-path ../Cargo.toml
          python3 scripts/check_feature_profiles.py
        working-directory: firmware

  build-pico2:
    name: Build Pico 2 W (${{ matrix.profile }})
    runs-on: ubuntu-latest
    env:
      CAPTURE_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
      CAPTURE_ROOT: firmware/target/bench-captures
    strategy:
      matrix:
        include:
          - profile: stock
            features: ""
            extra_args: ""
          - profile: cpu132-spi66-1v10
            features: cpu132-spi66-1v10
            extra_args: --expert
          - profile: cpu140-spi70-1v10
            features: cpu140-spi70-1v10
            extra_args: --expert
          - profile: cpu150-spi15-1v10
            features: cpu150-spi15-1v10
            extra_args: ""
          - profile: cpu250-spi62-1v10
            features: cpu250-spi62-1v10
            extra_args: --expert
          - profile: cpu280-spi70-1v30
            features: cpu280-spi70-1v30
            extra_args: --expert
          - profile: cpu290-spi72-1v30
            features: cpu290-spi72-1v30
            extra_args: --expert
          - profile: cpu300-spi75-1v30
            features: demo,frame-trace,te-trace,cpu300-spi75-1v30
            extra_args: --expert
          - profile: serial-full-frame
            features: serial-display,full-frame
            extra_args: ""
          - profile: longan-rx12
            features: longan-rx12,frame-trace,te-trace
            extra_args: ""
          - profile: ble-obd
            features: ble-obd,frame-trace,te-trace
            extra_args: ""
          - profile: ble-280-70
            features: ble-obd,cpu280-spi70-1v30,frame-trace,te-trace
            extra_args: --expert
          - profile: full-outline
            features: demo,frame-trace,te-trace
            extra_args: --no-default-features
          - profile: target-bench
            features: target-bench,ble-obd,frame-trace,te-trace
            extra_args: ""
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-18
          targets: thumbv8m.main-none-eabihf
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: firmware
          # Each capture intentionally builds in a fresh directory. Cache downloads,
          # not immutable captures or their private compiler output directories.
          cache-targets: 'false'
          prefix-key: v1-capture-downloads
      - name: Fetch capture-tool workspace dependencies
        run: cargo fetch --locked
      - name: Build pico2
        # rust-cache sets CARGO_INCREMENTAL=0. Capture owns compiler/profile inputs,
        # including strip=none; do not pass ambient overrides through its strict gate.
        run: |
          unset CARGO_INCREMENTAL
          python3 scripts/capture_target_bench.py "$CAPTURE_NAME" --firmware --image-gate practical --features "${{ matrix.features }}" ${{ matrix.extra_args }}
        working-directory: firmware
      # Capture runs the practical image gate with its explicit pre-build source context.
      - name: Check captured flash lockout contracts
        run: |
          python3 firmware/scripts/test_flash_lockout.py "$CAPTURE_ROOT/$CAPTURE_NAME/pico2.elf"
          python3 -O firmware/scripts/test_flash_lockout.py "$CAPTURE_ROOT/$CAPTURE_NAME/pico2.elf"

  ble-probe:
    name: Standalone BLE probe (${{ matrix.profile }})
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      DEFMT_LOG: info,trouble_host=warn,cyw43=warn,cyw43_pio=warn
      CARGO_PROFILE_RELEASE_STRIP: none
    strategy:
      matrix:
        include:
          - profile: stock
            features: ""
          - profile: 280-70
            features: cpu280-spi70-1v30
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-18
          components: clippy
          targets: thumbv8m.main-none-eabihf
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: firmware
      - name: Strict utility Clippy
        run: cargo clippy --locked -p dashboard-ble-probe --bin ble-probe --target thumbv8m.main-none-eabihf --features "${{ matrix.features }}" -- -D warnings
      - name: Build optimized utility with Cortex-M33 flags from Cargo config
        run: cargo build --locked -p dashboard-ble-probe --bin ble-probe --release --target thumbv8m.main-none-eabihf --features "${{ matrix.features }}"
      - name: Check linked layout and conservative stack paths
        # This is explicitly the ELF-only CI stage. CLI captures additionally
        # bind sources/options and check pinned-converter UF2 equality.
        run: python3 scripts/ble_probe_image.py target/thumbv8m.main-none-eabihf/release/ble-probe --elf-only --result target/ble-probe-layout.json
