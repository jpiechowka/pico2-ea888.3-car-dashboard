name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-10
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
        working-directory: firmware
      - name: Check host formatting
        run: cargo fmt --all --check
        working-directory: host

  host:
    name: Host contracts and benchmark smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-10
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: host
      - name: Host contracts
        run: cargo test --locked
        working-directory: host
      - name: Verify vendored HAL source
        run: python3 scripts/check_vendor.py
        working-directory: firmware
      - name: Full outline contracts
        run: cargo test --locked --no-default-features
        working-directory: host
      - name: Host Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: host
      - name: Benchmark smoke
        run: cargo test --locked --benches
        working-directory: host

  clippy-pico2:
    name: Clippy (Pico 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-10
          components: clippy
          targets: thumbv8m.main-none-eabihf
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: firmware
      - name: Clippy (pico2)
        run: cargo clippy --locked -p dashboard-pico2 --target thumbv8m.main-none-eabihf -- -D warnings
        working-directory: firmware
      - name: UART ownership compile guards
        run: python3 scripts/check_uart_api.py
        working-directory: firmware
      - name: Vehicle transport Clippy
        run: cargo clippy --locked -p dashboard-pico2 --features longan-rx12 -- -D warnings
        working-directory: firmware

  build-pico2:
    name: Build Pico 2 (${{ matrix.profile }})
    runs-on: ubuntu-latest
    env:
      # Keep linker symbols for the layout check; target code is still optimized.
      CARGO_PROFILE_RELEASE_STRIP: none
    strategy:
      matrix:
        include:
          - profile: stock
            features: ""
          - profile: cpu300-spi75-1v30
            features: demo,frame-trace,te-trace,cpu300-spi75-1v30
          - profile: serial-full-frame
            features: serial-display,full-frame
          - profile: longan-rx12
            features: longan-rx12,frame-trace
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-10
          targets: thumbv8m.main-none-eabihf
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: firmware
      - name: Build pico2
        run: cargo build --locked -p dashboard-pico2 --target thumbv8m.main-none-eabihf --release --features "${{ matrix.features }}"
        working-directory: firmware
      - name: Check linked RAM boundaries
        run: python3 scripts/check_memory_layout.py target/thumbv8m.main-none-eabihf/release/pico2
        working-directory: firmware
