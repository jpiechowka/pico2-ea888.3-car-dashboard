[package]
name = "studio-helper"
version = "0.1.0"
edition = "2024"
description = "Native Studio helper pure job and framing core"

[workspace]

[dependencies]
dashboard-helper-protocol = { path = "../crates/dashboard-helper-protocol" }
serde_json = "=1.0.154"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "=1.53.2", features = ["rt", "net", "time", "sync", "signal", "macros"] }
hyper = { version = "=1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio", "service"] }
getrandom = "=0.4.3"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_SystemInformation", "Wdk_System_SystemServices"] }
