[package]
name = "dashboard-config"
version = "0.1.0"
edition = "2024"
description = "Bounded dashboard configuration shared by device and editor"

[features]
default = []
json = ["dep:serde_json"]

[dependencies]
heapless = { version = "=0.9.3", default-features = false, features = ["serde"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive"] }
postcard = { version = "=1.1.3", default-features = false }
serde_json = { version = "=1.0.154", optional = true, features = ["float_roundtrip", "raw_value"] }
