[package]
name = "dashboard-provenance"
version = "0.1.0"
edition = "2024"
description = "Bounded verification of reviewed vendor source and archive provenance"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2-const-stable = "=0.1.0"
flate2 = "=1.1.10"
tar = { version = "=0.4.46", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
