[tool.ruff]
required-version = "==0.17.1"
target-version = "py311"
line-length = 100
include = ["firmware/scripts/**/*.py", "host/scripts/**/*.py", "configurator/scripts/**/*.py", "studio-helper/tests/**/*.py", "scripts/**/*.py"]
extend-exclude = ["**/target", "firmware/vendor", "host/baselines", ".superpowers", "ea888-pico2-audit-bundle"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B006", "B012", "B018", "B019", "B021", "B024", "B027", "B032", "B904", "RUF006", "RUF100"]

[tool.ruff.format]
line-ending = "lf"
