[tool.ruff]
required-version = "==0.17.1"
target-version = "py311"
line-length = 100
include = ["**/*.py"]
extend-exclude = ["**/target", "host/baselines", ".superpowers", "ea888-pico2-audit-bundle"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B006", "B012", "B018", "B019", "B021", "B024", "B027", "B032", "B904", "RUF006", "RUF100"]

[tool.ruff.format]
line-ending = "lf"

# All Python, including tests, vendor generation and deferred research. CI uses
# check_python.py's Git inventory so a new directory cannot silently escape.
[tool.mypy]
python_version = "3.11"
strict = true
files = [
    "firmware/scripts",
    "host/scripts",
    "configurator/scripts",
    "studio-helper/tests",
    "firmware/vendor/trouble-host/gen_config.py",
    "docs",
]
