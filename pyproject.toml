[tool.ruff]
required-version = "==0.17.1"
target-version = "py311"
line-length = 100
include = ["firmware/scripts/**/*.py", "host/scripts/**/*.py", "configurator/scripts/**/*.py", "studio-helper/tests/**/*.py", "scripts/**/*.py"]
extend-exclude = ["**/target", "firmware/vendor", "host/baselines", ".superpowers", "ea888-pico2-audit-bundle"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B006", "B012", "B018", "B019", "B021", "B024", "B027", "B032", "B904", "RUF006", "RUF100"]

[tool.ruff.format]
line-ending = "lf"

# Type production binary-reader, process and reproducibility boundaries. Legacy
# instruction-proof modules remain linted; they are not claimed to be fully typed.
[tool.mypy]
python_version = "3.11"
strict = true
files = [
    "firmware/scripts/validation.py",
    "firmware/scripts/elf_image.py",
    "host/scripts/source_inventory.py",
    "host/scripts/benchmark_environment.py",
    "host/scripts/owned_process.py",
    "firmware/scripts/check_vendor.py",
    "firmware/scripts/check_radio_vendor.py",
]
