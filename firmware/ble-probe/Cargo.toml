[package]
name = "dashboard-ble-probe"
version = "0.1.0"
edition = "2024"
description = "Standalone Pico 2 W BLE discovery and manual GATT inspection"
autolib = false
autobins = false

[[bin]]
name = "ble-probe"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "ngm-identity"
path = "src/bin/ngm_identity.rs"
required-features = ["ngm-identity"]
test = false
bench = false

[features]
default = []
ngm-identity = []
cpu280-spi70-1v30 = ["dashboard-pico2/cpu280-spi70-1v30"]

[dependencies]
bt-hci = "0.10.1"
dashboard-pico2 = { path = "../pico2", default-features = false }
cyw43 = { version = "0.7.0", features = ["bluetooth-only", "defmt"] }
cyw43-pio = { version = "0.10.0" }
trouble-host = { version = "0.8.0", default-features = false, features = ["central", "gatt", "scan", "discovery-no-security", "defmt", "default-packet-pool-size-8", "default-packet-pool-mtu-251", "gatt-client-notification-queue-size-4"] }
dashboard-core = { path = "../../crates/dashboard-core", default-features = false }
embedded-graphics = "0.8.2"
embedded-hal-async = "1.0.0"
heapless = "0.9.3"
micromath = "2.1.0"
profont = "0.7.0"
cortex-m-rt = "0.7.7"
cortex-m = "0.7.9"
defmt = "1.2.0"
# Keep the multicore critical-section encoder. Never enable drop-on-contention.
defmt-rtt = { version = "1.3.1", features = ["disable-blocking-mode"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "defmt", "executor-thread"] }
embassy-futures = "0.1.2"
embassy-rp = { version = "0.10.0", features = ["binary-info", "critical-section-impl", "defmt", "rp235xa", "time-driver", "unstable-pac"] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-usb = { version = "0.6.0", default-features = false, features = ["defmt"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
static_cell = "2.1.1"
