[package]
name = "dashboard-pico2"
version = "0.1.0"
edition = "2024"
description = "OBD-II dashboard firmware for Raspberry Pi Pico 2 (RP2350)"

[lib]
name = "dashboard_pico2"
path = "src/lib.rs"

[[bin]]
name = "pico2"
path = "src/main.rs"

[features]
default = ["simple-outline"]
# Explicit synthetic backend. Vehicle never falls back to synthetic values.
demo = []
# Explicit preprovisioned adapter bring-up. Receive metadata remains unqualified.
longan-rx12 = ["dep:embedded-io-async"]
# Overclock profiles: cpu{MHz}-spi{MHz}-{voltage}
# All profiles use simple-outline by default for best FPS
cpu250-spi62-1v10 = []  # 250 MHz @ 1.10V - experimental 62.5 MHz SPI; panel timing unverified
cpu280-spi70-1v30 = []  # 280 MHz @ 1.30V - 70 MHz SPI (280/4, beyond datasheet)
cpu290-spi72-1v30 = []  # 290 MHz @ 1.30V - 72.5 MHz SPI (290/4)
cpu300-spi75-1v30 = []  # 300 MHz @ 1.30V - 75 MHz SPI (300/4, unverified panel timing)
simple-outline = ["dashboard-core/simple-outline"]
# Keep ownership checks while disabling render/transfer overlap for diagnostics.
serial-display = []
# Bypass damage selection while retaining ownership and per-transfer telemetry.
full-frame = []
# Keep the last 64 coherent software transfer records in SRAM for probe capture.
frame-trace = []
# Observe GP21 TE edges; no refresh-rate registers or DMA scheduling changes.
te-trace = []
# Finite boot microbenchmarks on the caller-owned framebuffer. Default off.
target-bench = []

[dependencies]
dashboard-core = { path = "../../crates/dashboard-core", default-features = false }
embedded-graphics = "0.8.2"
embedded-hal-async = "1.0.0"
embedded-io-async = { version = "0.7.0", optional = true }
heapless = "0.9.3"
micromath = "2.1.0"
profont = "0.7.0"
cortex-m-rt = "0.7.7"
cortex-m = "0.7.9"
defmt = "1.1.1"
# Keep the multicore critical-section encoder. Never enable drop-on-contention.
defmt-rtt = { version = "1.3.0", features = ["disable-blocking-mode"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "defmt", "executor-thread"] }
embassy-futures = "0.1.2"
embassy-rp = { version = "0.10.0", features = ["binary-info", "critical-section-impl", "defmt", "rp235xa", "time-driver", "unstable-pac"] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
static_cell = "2.1.1"
