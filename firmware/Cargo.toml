[workspace]
resolver = "2"
members = ["pico2"]
exclude = ["vendor/embassy-rp"]

[patch.crates-io]
# Published 0.10.0 plus documented buffered UART corrections. See vendor/README.md.
embassy-rp = { path = "vendor/embassy-rp" }

[profile.release]
codegen-units = 1
debug = false
lto = "fat"
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
debug = true
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
