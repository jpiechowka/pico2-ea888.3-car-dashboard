[env]
DEFMT_LOG = "debug"

[build]
target = "thumbv8m.main-none-eabihf"

[target."thumbv8m.main-none-eabihf"]
rustflags = [
    "-Z", "emit-stack-sizes",
    "-C", "link-arg=--nmagic",
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=-Tdefmt.x",
    "-C", "target-cpu=cortex-m33",
]
runner = "tools/picotool.exe load -u -v -x -t elf"

[alias]
pico2 = "build -p dashboard-pico2 --release"
pico2-run = "run -p dashboard-pico2 --release"
pico2-fast = "build -p dashboard-pico2 --release --features simple-outline"
pico2-fast-run = "run -p dashboard-pico2 --release --features simple-outline"

# Explicit stock and timing candidates; panel timing remains unqualified.
pico2-150-62-1v10 = "build -p dashboard-pico2 --release --features simple-outline,cpu150-spi62-1v10"
pico2-150-62-1v10-run = "run -p dashboard-pico2 --release --features simple-outline,cpu150-spi62-1v10"
pico2-132-66-1v10 = "build -p dashboard-pico2 --release --features simple-outline,cpu132-spi66-1v10"
pico2-132-66-1v10-run = "run -p dashboard-pico2 --release --features simple-outline,cpu132-spi66-1v10"
pico2-140-70-1v10 = "build -p dashboard-pico2 --release --features simple-outline,cpu140-spi70-1v10"
pico2-140-70-1v10-run = "run -p dashboard-pico2 --release --features simple-outline,cpu140-spi70-1v10"
pico2-150-15-1v10 = "build -p dashboard-pico2 --release --features simple-outline,cpu150-spi15-1v10"
pico2-150-15-1v10-run = "run -p dashboard-pico2 --release --features simple-outline,cpu150-spi15-1v10"

# Overclock profiles: cpu{MHz}-spi{MHz}-{voltage}
# All use simple-outline for best FPS

# 250 MHz @ 1.10V (experimental 62.5 MHz SPI; panel timing unverified)
pico2-250-62-1v10 = "build -p dashboard-pico2 --release --features simple-outline,cpu250-spi62-1v10"
pico2-250-62-1v10-run = "run -p dashboard-pico2 --release --features simple-outline,cpu250-spi62-1v10"

# 280 MHz @ 1.30V (70 MHz SPI - beyond ST7789 datasheet)
pico2-280-70-1v30 = "build -p dashboard-pico2 --release --features simple-outline,cpu280-spi70-1v30"
pico2-280-70-1v30-run = "run -p dashboard-pico2 --release --features simple-outline,cpu280-spi70-1v30"

# Legacy: requested290/72.5 MHz, actual290.4/48.4 MHz; user-reported failure.
pico2-290-72-1v30 = "build -p dashboard-pico2 --release --features simple-outline,cpu290-spi72-1v30"
pico2-290-72-1v30-run = "run -p dashboard-pico2 --release --features simple-outline,cpu290-spi72-1v30"

# 300 MHz @ 1.30V (75 MHz SPI - unverified panel timing)
pico2-300-75-1v30 = "build -p dashboard-pico2 --release --features simple-outline,cpu300-spi75-1v30"
pico2-300-75-1v30-run = "run -p dashboard-pico2 --release --features simple-outline,cpu300-spi75-1v30"
