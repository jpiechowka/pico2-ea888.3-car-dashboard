[package]
name = "dashboard-configurator"
version = "0.1.0"
edition = "2024"
description = "Pure Rust editing state for the dashboard view studio"

[workspace]
resolver = "2"

[dependencies]
dashboard-config = { path = "../crates/dashboard-config", features = ["json"] }
heapless = { version = "=0.9.3", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
