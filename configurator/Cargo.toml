[package]
name = "dashboard-configurator"
version = "0.1.0"
edition = "2024"
description = "Pure Rust editing state for the dashboard view studio"

[workspace]
resolver = "2"

[dependencies]
dashboard-build-profiles = { path = "../crates/dashboard-build-profiles", features = ["serde"] }
dashboard-helper-protocol = { path = "../crates/dashboard-helper-protocol" }
dashboard-config = { path = "../crates/dashboard-config", features = ["json"] }
dashboard-core = { path = "../crates/dashboard-core", features = ["alloc"] }
embassy-sync = "=0.8.0"
embedded-graphics = "=0.8.2"
heapless = { version = "=0.9.3", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
critical-section = { version = "=1.2.0", features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "=0.8.22", features = ["csr"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = [
    "console", "Blob", "BlobPropertyBag", "CanvasRenderingContext2d", "Clipboard", "Document",
    "DomException", "DomRect", "Element", "Event", "EventTarget", "File", "FileList", "FocusOptions",
    "HtmlAnchorElement", "HtmlCanvasElement", "HtmlDialogElement", "HtmlElement", "HtmlInputElement",
    "HtmlSelectElement", "HtmlTextAreaElement", "InputEvent", "ImageData", "KeyboardEvent", "MouseEvent", "Navigator", "Node", "NodeList", "Performance", "PointerEvent",
    "PerformanceObserver", "PerformanceObserverInit", "PerformanceObserverEntryList", "PerformanceEntry",
    "Storage", "StorageEvent", "Url", "Window",
] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = false
